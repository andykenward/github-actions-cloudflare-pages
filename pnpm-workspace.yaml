allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  workerd: false
minimumReleaseAge: 10080
# Keeps pnpm-lock.yaml a single YAML document: with the default `download`,
# pnpm 12 prepends a boot document that GitHub's dependency graph reads as an
# empty lockfile, so alerts and security PRs stop (dependabot-core#15904).
pmOnFail: ignore
