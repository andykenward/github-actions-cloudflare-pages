# Posts the deployment comment; `input.subjectId` is the pull request node id.
mutation AddPullRequestComment($input: AddCommentInput!) {
  addComment(input: $input) {
    commentEdge {
      node {
        id
      }
    }
  }
}

# The node id of pull request `number`, from the `pr-number` input or a
# `workflow_run` payload.
query GetPullRequestId($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      id
    }
  }
}

# The open pull request whose head is `headRefName`, for `workflow_dispatch`.
query GetOpenPullRequestByBranch(
  $owner: String!
  $repo: String!
  $headRefName: String!
) {
  repository(owner: $owner, name: $repo) {
    pullRequests(first: 1, states: [OPEN], headRefName: $headRefName) {
      nodes {
        id
      }
    }
  }
}

# Edits the deployment comment in place, so a pull request keeps one comment.
mutation UpdatePullRequestComment($input: UpdateIssueCommentInput!) {
  updateIssueComment(input: $input) {
    issueComment {
      id
    }
  }
}

# The pull request a previous deployment comment is on: it is reused only on
# the same pull request, since a branch can be reused for a new one.
query GetPullRequestComment($id: ID!) {
  node(id: $id) {
    ... on IssueComment {
      id
      pullRequest {
        id
      }
    }
  }
}
