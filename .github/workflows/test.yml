# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: test
permissions: {}
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Coverage report comment
      pull-requests: write
      # Lint SARIF upload to code scanning
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          # Skip the vendored repos/ (most of the repo's files); blob:none fetches only the files checked out
          filter: blob:none
          sparse-checkout: |
            /*
            !/repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-pnpm
      - name: Lint
        id: lint
        # Code scanning annotates every finding; --format=github stops at 10 per step
        run: pnpm --silent run lint --format=sarif > oxlint.sarif
      - name: Upload lint results
        # A fork PR's token can't upload, so it gets only the failing step
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 #v4.39.1
        with:
          sarif_file: oxlint.sarif
          category: oxlint
      - name: Typecheck
        run: pnpm run tsc:check
      - name: Test
        id: test
        run: pnpm run test:ci --coverage
      - name: Coverage report
        # Also report when tests fail (`reportOnFailure` in vitest.config.ts)
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 #v2.13.2
        with:
          json-summary-path: .cache/coverage/coverage-summary.json
          json-final-path: .cache/coverage/coverage-final.json
          # A fork PR's token can't comment, so it gets only the step summary
          comment-on: ${{ github.event.pull_request.head.repo.fork && 'none' || 'pr' }}
