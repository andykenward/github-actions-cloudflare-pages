# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # First matching group wins, so the catch-all goes last. Majors of
    # third-party actions stay as individual PRs so their breaking changes get
    # reviewed on their own.
    groups:
      # GitHub-maintained actions release in step (runtime bumps), so take
      # their majors together too.
      github:
        patterns:
          - 'actions/*'
          - 'github/*'
      # `changesets/action`, `/pr-status` and `/pr-comment` are one repo at one
      # SHA; without this each sub-action gets its own PR (#893–#895).
      changesets:
        patterns:
          - 'changesets/action*'
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # `pnpm-workspace.yaml` sets `minimumReleaseAge` to 7 days, and pnpm
    # enforces it when Dependabot rewrites the lockfile. A shorter cooldown
    # here selects a version pnpm then rejects, and the whole update fails.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Vendored read-only reference source (`pnpm run sync:effect`); its
    # manifests and lockfiles are upstream's, not dependencies of this action.
    # This only stops version updates — security updates are handled by the
    # `/repos/*` entry below.
    exclude-paths:
      - 'repos/**'
    ignore:
      # `undici` is only used in tests, where `setGlobalDispatcher()` patches the
      # dispatcher that Node's *built-in* `fetch` reads. That handshake is a
      # versioned global symbol (`Symbol.for('undici.globalDispatcher.N')`), so
      # the devDependency must stay on the same major as Node's bundled copy
      # (`process.versions.undici`) or `MockAgent` silently stops intercepting
      # and tests hit the real network. Node 24 bundles undici 7.x; only raise
      # this once Node's bundled major moves.
      - dependency-name: undici
        update-types: ['version-update:semver-major']
    groups:
      graphql:
        patterns:
          - '@graphql-codegen/*'
          - '@graphql-typed-document-node/*'
          - 'graphql'
          - 'graphql-tag'
      vitest:
        patterns:
          - '@vitest*'
          - 'vitest'
          - 'vite'
      # `@effect/vitest` and `@effect/openapi-generator` peer on
      # `^<effect version>`, so bump them together. After merging, run
      # `pnpm run sync:effect` to refresh `repos/effect` and
      # `pnpm run codegen:cloudflare` to regenerate the Cloudflare client.
      effect:
        patterns:
          - 'effect'
          - '@effect/vitest'
          - '@effect/openapi-generator'
      # `@effect/tsgo` patches the `oxlint` / `oxlint-tsgolint` binaries in
      # place, so it is version-coupled to them rather than to `effect`.
      ox:
        patterns:
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
          - '@effect/tsgo'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      changesets:
        patterns:
          - '@changesets/*'
  # The vendored repositories under `repos/` are snapshots of upstream: their
  # lockfiles are never installed here, so a vulnerable package in them is
  # upstream's to fix, and a PR bumping it would only make the snapshot drift
  # from its tag. `exclude-paths` above stops version updates only; security
  # updates come from alerts on the dependency graph, which still reads those
  # lockfiles, and honor `ignore` — so ignore everything in that directory.
  - package-ecosystem: npm
    directories:
      - '/repos/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
