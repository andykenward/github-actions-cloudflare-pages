# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # `undici` is only used in tests, where `setGlobalDispatcher()` patches the
      # dispatcher that Node's *built-in* `fetch` reads. That handshake is a
      # versioned global symbol (`Symbol.for('undici.globalDispatcher.N')`), so
      # the devDependency must stay on the same major as Node's bundled copy
      # (`process.versions.undici`) or `MockAgent` silently stops intercepting
      # and tests hit the real network. Node 24 bundles undici 7.x; only raise
      # this once Node's bundled major moves.
      - dependency-name: undici
        update-types: ['version-update:semver-major']
    groups:
      graphql:
        patterns:
          - '@graphql-codegen/*'
          - '@graphql-typed-document-node/*'
          - 'graphql'
          - 'graphql-tag'
      vitest:
        patterns:
          - '@vitest*'
          - 'vitest'
          - 'vite'
      ox:
        patterns:
          - 'oxfmt'
          - 'oxlint'
          - 'oxlint-tsgolint'
      octokit:
        patterns:
          - '@octokit/*'
          - '@octokit-next/*'
      cloudflare:
        patterns:
          - '@cloudflare/*'
          - 'wrangler'
      changesets:
        patterns:
          - '@changesets/*'
